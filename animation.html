        @keyframes Jangir {
            0% {
                margin-bottom: 0px;
            }

            20% {
                margin-top: 0px;
                padding-left: 50px;
            }

            30% {
                margin-bottom: 10px;

                padding-top: 50px;
            }

            40% {
                margin-top: 2px;
                padding-bottom: 10px;
            }

            50% {
                margin-top: 0px;
                margin-bottom: 0px;
                padding-top: 0px;
            }

            100% {
                margin-top: 10px;
            }
        }

        @keyframes jangir2 {
            /* 0%,
              20%,  50%, 100%{
                text-shadow: 2px 5px 10px red, 5px 10px 50px red,
                0px 0px 60px red, 0px 0px 80px red, 0px 0px 100px red,

              } */

            0% {
                text-shadow: 2px 5px 10px red;
            }

            20% {
                text-shadow: 2px 5px 10px red, 5px 10px 50px red;
            }

            30% {
                text-shadow: 2px 5px 10px red, 5px 10px 50px red,

            }

            60% {

                    0px 0px 150px red, 0px 0px 200px red, 0px 0px 250px red;

            95% {
                text-shadow: 2px 5px 10px red, 5px 10px 50px red,

            25% {

            75% {
